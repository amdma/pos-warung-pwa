<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>POS Warung</title>
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --bg: #faf7f2;
      --card: #ffffff;
      --text: #2b2118;
      --muted: #7a6b5d;
      --accent: #d9480f;
      --accent-text: #ffffff;
      --line: #e8dfd3;
      --ok: #2b8a3e;
      --bad: #c92a2a;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1b1612;
        --card: #262019;
        --text: #f3ece3;
        --muted: #a8998a;
        --accent: #f76707;
        --accent-text: #1b1612;
        --line: #3a3128;
        --ok: #51cf66;
        --bad: #ff6b6b;
      }
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
    }

    body {
      padding: 12px;
      max-width: 1000px;
      margin: 0 auto
    }

    h1 {
      font-size: 1.2rem;
      margin: 4px 0 12px
    }

    h2 {
      font-size: 1rem;
      margin: 0 0 8px;
      color: var(--muted)
    }

    .layout {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr
    }

    @media(min-width:760px) {
      .layout {
        grid-template-columns: 1.4fr 1fr
      }
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px
    }

    .menu .tile {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden
    }

    .menu .tile.terpilih {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent)
    }

    .menu .tile-btn {
      width: 100%;
      background: none;
      color: var(--text);
      border: none;
      padding: 14px 8px;
      font-size: 1rem;
      cursor: pointer;
      text-align: center;
      min-height: 72px
    }

    .menu .tile-btn:active {
      background: var(--line)
    }

    .tile-qty {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px;
      border-top: 1px solid var(--line)
    }

    .tile-qty button {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      font-size: 1.3rem;
      cursor: pointer
    }

    .tile-qty b {
      font-size: 1.2rem;
      min-width: 28px;
      text-align: center
    }

    .menu .nama {
      display: block;
      font-weight: 600
    }

    .menu .harga {
      display: block;
      color: var(--muted);
      font-size: .85rem;
      margin-top: 4px
    }

    .item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line)
    }

    .item .info {
      flex: 1;
      min-width: 0
    }

    .item .sub {
      color: var(--muted);
      font-size: .85rem
    }

    .qty {
      display: flex;
      align-items: center;
      gap: 6px
    }

    .qty button {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      font-size: 1.3rem;
      cursor: pointer
    }

    .qty span {
      min-width: 24px;
      text-align: center;
      font-weight: 700
    }

    .kosong {
      color: var(--muted);
      text-align: center;
      padding: 20px 0
    }

    .total {
      display: flex;
      justify-content: space-between;
      font-size: 1.4rem;
      font-weight: 700;
      padding: 12px 0 8px
    }

    label {
      display: block;
      color: var(--muted);
      font-size: .85rem;
      margin-top: 6px
    }

    input {
      width: 100%;
      font-size: 1.3rem;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text)
    }

    .cepat {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px
    }

    .cepat button {
      flex: 1;
      min-width: 70px;
      padding: 10px 4px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      font-size: .95rem;
      cursor: pointer
    }

    .kembalian {
      display: flex;
      justify-content: space-between;
      font-size: 1.3rem;
      font-weight: 700;
      margin-top: 12px
    }

    .ok {
      color: var(--ok)
    }

    .kurang {
      color: var(--bad)
    }

    .aksi {
      display: flex;
      gap: 8px;
      margin-top: 12px
    }

    .aksi button {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer
    }

    .btn-selesai {
      background: var(--accent);
      color: var(--accent-text)
    }

    .btn-selesai:disabled {
      opacity: .4;
      cursor: not-allowed
    }

    .btn-reset {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line) !important
    }

    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      overflow-x: auto
    }

    .tabs button {
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      font-size: .95rem;
      cursor: pointer;
      white-space: nowrap
    }

    .tabs button.aktif {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
      font-weight: 700
    }

    .bebas {
      display: flex;
      gap: 6px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--line)
    }

    .bebas input {
      font-size: 1rem;
      padding: 10px;
      min-width: 0
    }

    .bebas input:first-child {
      flex: 1.4
    }

    .bebas input:nth-child(2) {
      flex: 1
    }

    .bebas button {
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      background: var(--ok);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      opacity: 0;
      transition: opacity .25s;
      pointer-events: none
    }

    #toast.tampil {
      opacity: 1
    }

    /* ===== Navigasi, antrian, riwayat ===== */
    [hidden] {
      display: none !important
    }

    .nav {
      display: flex;
      gap: 6px;
      margin-bottom: 12px
    }

    .nav button {
      flex: 1;
      padding: 12px 8px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
      cursor: pointer
    }

    .nav button.aktif {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
      font-weight: 700
    }

    .badge {
      display: inline-block;
      min-width: 22px;
      padding: 1px 7px;
      border-radius: 999px;
      background: var(--bad);
      color: #fff;
      font-size: .8rem;
      margin-left: 4px
    }

    #labelPesanan {
      font-size: 1rem;
      margin-bottom: 8px
    }

    .aksi {
      flex-wrap: wrap
    }

    .btn-simpan {
      order: -1;
      flex-basis: 100%;
      background: var(--bg);
      color: var(--accent);
      border: 2px solid var(--accent) !important
    }

    .btn-simpan:disabled {
      opacity: .4;
      cursor: not-allowed
    }

    .kartu {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 8px;
      background: var(--bg)
    }

    .kepala {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px
    }

    .status {
      font-size: .8rem;
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 700
    }

    .status.menunggu {
      background: #ffe8cc;
      color: #a14b00
    }

    .status.disajikan {
      background: #d3f9d8;
      color: #1b6e2d
    }

    .aksi-kartu {
      display: flex;
      gap: 6px;
      margin-top: 10px
    }

    .aksi-kartu button {
      flex: 1;
      padding: 12px 6px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      font-size: .95rem;
      cursor: pointer
    }

    .aksi-kartu .b-buka {
      flex: 1.5;
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
      font-weight: 700
    }

    /* ===== Bar bawah + panel pesanan (khusus HP) =====
   Di layar lebar (>=760px) tampilan tetap 2 kolom seperti biasa. */
    .bar,
    .backdrop,
    .btn-tutup {
      display: none
    }

    .batal-kecil {
      float: right;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--bad);
      background: var(--bg);
      color: var(--bad);
      font-size: .85rem;
      cursor: pointer
    }

    @media(max-width:759px) {
      body {
        padding-bottom: 90px
      }

      .bar {
        display: flex;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
        background: var(--card);
        border-top: 1px solid var(--line)
      }

      #barItem {
        color: var(--muted);
        font-size: .85rem
      }

      .bar-total {
        font-size: 1.2rem;
        font-weight: 700
      }

      .bar button {
        padding: 14px 18px;
        border-radius: 12px;
        border: none;
        background: var(--accent);
        color: var(--accent-text);
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer
      }

      #panelPesanan {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 30;
        max-height: 88vh;
        overflow-y: auto;
        border-radius: 16px 16px 0 0;
        padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px))
      }

      body.sheet-buka #panelPesanan {
        display: block
      }

      body.sheet-buka .backdrop {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .45);
        z-index: 25
      }

      .btn-tutup {
        display: block
      }

      #toast {
        bottom: calc(100px + env(safe-area-inset-bottom, 0px))
      }
    }
  </style>
</head>

<body>
  <h1>🍜 POS Warung</h1>

  <nav class="nav" id="nav">
    <button data-v="kasir" class="aktif">Kasir</button>
    <button data-v="antrian">Antrian <span id="jmlAntrian" class="badge">0</span></button>
    <button data-v="riwayat">Riwayat</button>
  </nav>

  <div class="layout" id="viewKasir">
    <section class="panel">
      <h2>Menu (tap untuk tambah)</h2>
      <div class="tabs" id="tabs"></div>
      <div class="menu" id="menu"></div>
      <div class="bebas">
        <input id="bebasNama" placeholder="Item bebas (nama)">
        <input id="bebasHarga" type="text" inputmode="decimal" placeholder="Harga (ribu)">
        <button id="btnBebas">+ Tambah</button>
      </div>
    </section>

    <section class="panel" id="panelPesanan">
      <h2>Pesanan <button class="batal-kecil" id="btnBatal">Batal ✕</button></h2>
      <input id="labelPesanan" placeholder="Nama / meja (mis. Meja 3, Pak Budi)">
      <div id="keranjang"></div>

      <div class="total"><span>Total</span><span id="total">Rp 0</span></div>

      <label for="bayar">Uang dibayar</label>
      <input id="bayar" type="number" inputmode="numeric" placeholder="0">
      <div class="cepat" id="cepat"></div>

      <div class="kembalian"><span id="labelKembalian">Kembalian</span><span id="kembalian">Rp 0</span></div>

      <div class="aksi">
        <button class="btn-reset btn-tutup" id="btnTutup">Tutup</button>
        <button class="btn-simpan" id="btnSimpan" disabled>Simpan ke antrian</button>
        <button class="btn-selesai" id="btnSelesai" disabled>Bayar &amp; selesai</button>
      </div>
    </section>
  </div>
  <section id="viewAntrian" hidden>
    <div class="panel">
      <h2>Antrian pesanan</h2>
      <div id="listAntrian"></div>
    </div>
  </section>
  <section id="viewRiwayat" hidden>
    <div class="panel">
      <h2>Riwayat <span id="ringkasHariIni"></span></h2>
      <div id="listRiwayat"></div>
    </div>
  </section>

  <div class="backdrop" id="backdrop"></div>
  <div class="bar" id="bar">
    <div>
      <div id="barItem">0 item</div>
      <div class="bar-total" id="barTotal">Rp 0</div>
    </div>
    <button id="btnBuka">Lihat pesanan ▲</button>
  </div>
  <div id="toast"></div>

  <script>
    /* ========== 1. DATA MENU ==========
       Ubah daftar ini sesuai menu warungmu.
       Tiap menu punya id UNIK, nama, dan harga. */
    const menu = [
      // kategori: bebas diisi, tab akan dibuat otomatis dari sini
      // --- Paket (lauk + nasi) ---
      { id: 1, kategori: "Paket", nama: "Ayam Goreng + Nasi", harga: 22000 },
      { id: 2, kategori: "Paket", nama: "Bebek Goreng + Nasi", harga: 23000 },
      { id: 3, kategori: "Paket", nama: "Lele Goreng + Nasi", harga: 14000 },
      { id: 4, kategori: "Paket", nama: "Tahu Tempe + Nasi", harga: 10000 },
      // --- Aneka Lauk (satuan) ---
      { id: 10, kategori: "Aneka Lauk", nama: "Ayam Goreng", harga: 18000 },
      { id: 11, kategori: "Aneka Lauk", nama: "Bebek Goreng", harga: 19000 },
      { id: 12, kategori: "Aneka Lauk", nama: "Lele Goreng", harga: 10000 },
      { id: 13, kategori: "Aneka Lauk", nama: "Ati Ampela", harga: 4000 },
      { id: 14, kategori: "Aneka Lauk", nama: "Uritan", harga: 4000 },
      { id: 15, kategori: "Aneka Lauk", nama: "Ceker", harga: 4000 },
      { id: 16, kategori: "Aneka Lauk", nama: "Tahu", harga: 4000 },
      { id: 17, kategori: "Aneka Lauk", nama: "Tempe", harga: 4000 },
      { id: 18, kategori: "Aneka Lauk", nama: "Kepala", harga: 5000 },
      { id: 19, kategori: "Aneka Lauk", nama: "Terong", harga: 3000 },
      { id: 20, kategori: "Aneka Lauk", nama: "Nasi Putih", harga: 4000 }, // harga dihitung dari selisih paket-lauk, sesuaikan
      // --- Minuman ---
      { id: 30, kategori: "Minuman", nama: "Es Jeruk", harga: 4000 },
      { id: 31, kategori: "Minuman", nama: "Es Teh", harga: 3000 },
      { id: 32, kategori: "Minuman", nama: "Teh Manis Hangat", harga: 3000 },
      { id: 33, kategori: "Minuman", nama: "Jeruk Hangat", harga: 4000 },
      { id: 34, kategori: "Minuman", nama: "Jeruk Tawar", harga: 3000 },
      { id: 35, kategori: "Minuman", nama: "Es Teh Tawar", harga: 2000 },
      { id: 36, kategori: "Minuman", nama: "Teh Tawar Hangat", harga: 2000 },
    ];

    /* ========== 1b. TOMBOL UANG CEPAT ==========
       Ubah angka di bawah sesuai kebutuhan (satuan rupiah).
       Tiap tap MENAMBAH uang dibayar: 20rb + 5rb = 25rb. */
    const pecahan = [2000, 5000, 10000, 20000, 50000, 100000];

    /* ========== 2. STATE (data yang berubah) ==========
       keranjang disimpan sebagai object: { idMenu: jumlah }
       Kenapa object, bukan array? Supaya menu yang sama
       tidak pernah tercatat dobel: tap lagi = jumlahnya naik. */
    let keranjang = {};

    // Item bebas: harga diketik manual saat transaksi (tidak ada di daftar menu).
    // Id-nya mulai dari 1000 supaya tidak bentrok dengan id menu.
    let itemBebas = {};
    let idBebas = Date.now(); // id besar & unik, supaya tidak bentrok dengan item bebas yang tersimpan
    let pesananAktif = null;  // id pesanan antrian yang sedang dibuka (null = pesanan baru)

    /* ========== 3. FUNGSI BANTU ========== */
    const rupiah = (n) => "Rp " + n.toLocaleString("id-ID");
    const $ = (id) => document.getElementById(id);
    const cariMenu = (id) => menu.find((m) => m.id === id) || itemBebas[id];

    function hitungTotal() {
      let total = 0;
      for (const id in keranjang) {
        total += cariMenu(Number(id)).harga * keranjang[id];
      }
      return total;
    }

    /* ========== 4. AKSI KERANJANG ========== */
    function tambah(id) {
      keranjang[id] = (keranjang[id] || 0) + 1;
      render();
    }

    function kurang(id) {
      keranjang[id]--;
      if (keranjang[id] <= 0) delete keranjang[id]; // hapus kalau jadi 0
      render();
    }

    function reset() {
      keranjang = {};
      itemBebas = {};
      document.body.classList.remove("sheet-buka"); // tutup panel (HP)
      pesananAktif = null;
      $("labelPesanan").value = "";
      $("bayar").value = "";
      render();
    }

    /* ========== 5. TAMPILAN (render) ==========
       Setiap data berubah, kita gambar ulang tampilan
       dari state. Ini pola dasar yang juga dipakai React/Vue. */
    let kategoriAktif = "Paket";
    function renderMenu() {
      // tab kategori dibuat otomatis dari data menu
      const kategori = [...new Set(menu.map((m) => m.kategori))];
      $("tabs").innerHTML = "";
      kategori.forEach((k) => {
        const t = document.createElement("button");
        const n = menu.filter((m) => m.kategori === k).reduce((s, m) => s + (keranjang[m.id] || 0), 0);
        t.textContent = n ? `${k} (${n})` : k; // angka = total porsi di kategori itu
        t.className = k === kategoriAktif ? "aktif" : "";
        t.onclick = () => { kategoriAktif = k; renderMenu(); };
        $("tabs").appendChild(t);
      });
      $("menu").innerHTML = "";
      menu.filter((m) => m.kategori === kategoriAktif).forEach((m) => {
        const qty = keranjang[m.id] || 0;
        const kartu = document.createElement("div");
        kartu.className = "tile" + (qty ? " terpilih" : "");
        kartu.innerHTML = `
      <button class="tile-btn"><span class="nama">${m.nama}</span><span class="harga">${rupiah(m.harga)}</span></button>
      ${qty ? `<div class="tile-qty"><button aria-label="kurang">−</button><b>${qty}</b><button aria-label="tambah">+</button></div>` : ""}`;
        kartu.querySelector(".tile-btn").onclick = () => tambah(m.id);
        if (qty) {
          const [btnK, btnT] = kartu.querySelectorAll(".tile-qty button");
          btnK.onclick = () => kurang(m.id);
          btnT.onclick = () => tambah(m.id);
        }
        $("menu").appendChild(kartu);
      });
    }

    function renderKeranjang() {
      const ids = Object.keys(keranjang);
      if (ids.length === 0) {
        $("keranjang").innerHTML = '<div class="kosong">Belum ada pesanan</div>';
        return;
      }
      $("keranjang").innerHTML = "";
      ids.forEach((id) => {
        const m = cariMenu(Number(id));
        const qty = keranjang[id];
        const baris = document.createElement("div");
        baris.className = "item";
        baris.innerHTML = `
      <div class="info">
        <div>${m.nama}</div>
        <div class="sub">${rupiah(m.harga)} × ${qty} = ${rupiah(m.harga * qty)}</div>
      </div>
      <div class="qty">
        <button aria-label="kurang">−</button>
        <span>${qty}</span>
        <button aria-label="tambah">+</button>
      </div>`;
        const [btnKurang, btnTambah] = baris.querySelectorAll("button");
        btnKurang.onclick = () => kurang(Number(id));
        btnTambah.onclick = () => tambah(Number(id));
        $("keranjang").appendChild(baris);
      });
    }

    function renderPembayaran() {
      const total = hitungTotal();
      const bayar = Number($("bayar").value) || 0;
      const selisih = bayar - total;

      $("total").textContent = rupiah(total);

      if (total > 0 && bayar < total) {
        $("labelKembalian").textContent = "Kurang";
        $("kembalian").textContent = rupiah(total - bayar);
        $("kembalian").className = "kurang";
      } else {
        $("labelKembalian").textContent = "Kembalian";
        $("kembalian").textContent = rupiah(Math.max(selisih, 0));
        $("kembalian").className = "ok";
      }

      // Tombol Selesai hanya aktif kalau ada pesanan dan uang cukup
      $("btnSelesai").disabled = !(total > 0 && bayar >= total);
      $("btnSimpan").disabled = !(total > 0);
    }

    // Tombol uang cepat: "Uang pas" + pecahan umum
    function renderCepat() {
      const total = hitungTotal();
      $("cepat").innerHTML = "";

      const pas = document.createElement("button");
      pas.textContent = "Uang pas";
      pas.onclick = () => { $("bayar").value = total; renderPembayaran(); };
      $("cepat").appendChild(pas);

      pecahan.forEach((p) => {
        const b = document.createElement("button");
        b.textContent = "+" + (p / 1000) + "rb";
        b.onclick = () => {
          $("bayar").value = (Number($("bayar").value) || 0) + p; // dijumlahkan
          renderPembayaran();
        };
        $("cepat").appendChild(b);
      });

      // Tombol hapus uang dibayar (kalau salah tap)
      const hapus = document.createElement("button");
      hapus.textContent = "Hapus";
      hapus.onclick = () => { $("bayar").value = ""; renderPembayaran(); };
      $("cepat").appendChild(hapus);
    }

    function renderBar() {
      let jumlah = 0;
      for (const id in keranjang) jumlah += keranjang[id];
      $("barItem").textContent = jumlah + " item";
      $("barTotal").textContent = rupiah(hitungTotal());
    }

    function render() {
      renderKeranjang();
      renderCepat();
      renderPembayaran();
      renderBar();
      renderMenu(); // perbarui jumlah per menu di halaman kasir
    }

    /* ========== 6. SELESAIKAN TRANSAKSI ==========
       Pesanan disimpan ke IndexedDB dengan status "lunas". */
    async function selesai() {
      try {
        const o = bangunPesanan();
        o.status = "lunas";
        o.dibayar = new Date().toISOString();
        o.bayar = Number($("bayar").value);
        await simpanPesanan(o);
        await muatData();
      } catch (e) {
        console.error(e);
        tampilToast("Gagal menyimpan, coba lagi");
        return; // jangan kosongkan keranjang kalau gagal
      }

      reset();
      const t = $("toast");
      t.textContent = "Transaksi selesai ✓";
      t.classList.add("tampil");
      setTimeout(() => t.classList.remove("tampil"), 1500);
    }

    /* ========== 6b. PENYIMPANAN (IndexedDB) ==========
       Satu "tabel" bernama orders. Tiap pesanan berisi:
       id, label, items (nama+harga disalin), status, total, waktu.
       status: menunggu -> disajikan -> lunas */
    let db;
    let semuaPesanan = [];

    function bukaDB() {
      return new Promise((ok, gagal) => {
        const r = indexedDB.open("pos-warung", 1);
        r.onupgradeneeded = () =>
          r.result.createObjectStore("orders", { keyPath: "id", autoIncrement: true });
        r.onsuccess = () => { db = r.result; ok(); };
        r.onerror = () => gagal(r.error);
      });
    }
    const store = (mode) => db.transaction("orders", mode).objectStore("orders");
    const jadiPromise = (r) => new Promise((ok, gagal) => {
      r.onsuccess = () => ok(r.result);
      r.onerror = () => gagal(r.error);
    });
    const simpanPesanan = (o) => jadiPromise(store("readwrite").put(o));
    const hapusPesanan = (id) => jadiPromise(store("readwrite").delete(id));

    async function muatData() {
      semuaPesanan = await jadiPromise(store("readonly").getAll());
      renderAntrian();
      renderRiwayat();
    }

    /* ========== 6c. ANTRIAN & RIWAYAT ========== */
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const namaPesanan = (p) => p.label || "Pesanan #" + p.id;
    const ringkas = (p) => p.items.map((i) => i.qty + "× " + i.nama).join(", ");

    function menitLalu(iso) {
      const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
      return m < 1 ? "baru saja" : m + " menit lalu";
    }

    function tampilToast(msg) {
      const t = $("toast");
      t.textContent = msg;
      t.classList.add("tampil");
      setTimeout(() => t.classList.remove("tampil"), 1500);
    }

    // Ubah isi keranjang saat ini menjadi object pesanan siap simpan
    function bangunPesanan() {
      const items = Object.keys(keranjang).map((id) => {
        const m = cariMenu(Number(id));
        return { id: m.id, nama: m.nama, harga: m.harga, qty: keranjang[id] };
      });
      const lama = pesananAktif ? semuaPesanan.find((p) => p.id === pesananAktif) : null;
      return {
        ...(lama || { dibuat: new Date().toISOString(), status: "menunggu" }),
        label: $("labelPesanan").value.trim(),
        items,
        total: hitungTotal(),
      };
    }

    async function simpanAntrian() {
      try {
        await simpanPesanan(bangunPesanan());
        await muatData();
      } catch (e) {
        console.error(e);
        tampilToast("Gagal menyimpan, coba lagi");
        return;
      }
      reset();
      tampilToast("Disimpan ke antrian ✓");
    }

    function bukaPesanan(p) {
      reset();
      p.items.forEach((i) => {
        keranjang[i.id] = i.qty;
        if (!menu.find((m) => m.id === i.id)) itemBebas[i.id] = { id: i.id, nama: i.nama, harga: i.harga };
      });
      pesananAktif = p.id;
      $("labelPesanan").value = p.label || "";
      tampilView("kasir");
      render();
      document.body.classList.add("sheet-buka"); // di HP langsung ke panel bayar
    }

    function renderAntrian() {
      const buka = semuaPesanan
        .filter((p) => p.status !== "lunas")
        .sort((a, b) => a.dibuat.localeCompare(b.dibuat)); // yang paling lama di atas
      $("jmlAntrian").textContent = buka.length;
      const el = $("listAntrian");
      if (!buka.length) { el.innerHTML = '<div class="kosong">Tidak ada antrian</div>'; return; }
      el.innerHTML = "";
      buka.forEach((p) => {
        const d = document.createElement("div");
        d.className = "kartu";
        d.innerHTML = `
      <div class="kepala"><b>${esc(namaPesanan(p))}</b>
        <span class="status ${p.status}">${p.status === "menunggu" ? "Menunggu" : "Disajikan"}</span></div>
      <div class="sub">${esc(ringkas(p))}</div>
      <div class="sub">${rupiah(p.total)} · ${menitLalu(p.dibuat)}</div>
      <div class="aksi-kartu">
        <button class="b-hapus">Hapus</button>
        ${p.status === "menunggu" ? '<button class="b-sajikan">Sajikan</button>' : ""}
        <button class="b-buka">Buka / Bayar</button>
      </div>`;
        const hapus = d.querySelector(".b-hapus");
        hapus.onclick = async () => {
          if (hapus.dataset.yakin) { await hapusPesanan(p.id); await muatData(); return; }
          hapus.dataset.yakin = "1";
          hapus.textContent = "Yakin?";
          setTimeout(() => { hapus.dataset.yakin = ""; hapus.textContent = "Hapus"; }, 3000);
        };
        const sajikan = d.querySelector(".b-sajikan");
        if (sajikan) sajikan.onclick = async () => {
          await simpanPesanan({ ...p, status: "disajikan", disajikan: new Date().toISOString() });
          await muatData();
        };
        d.querySelector(".b-buka").onclick = () => bukaPesanan(p);
        el.appendChild(d);
      });
    }

    function renderRiwayat() {
      const lunas = semuaPesanan
        .filter((p) => p.status === "lunas")
        .sort((a, b) => b.dibayar.localeCompare(a.dibayar)); // terbaru di atas
      const hariIni = lunas.filter((p) => new Date(p.dibayar).toDateString() === new Date().toDateString());
      const omzet = hariIni.reduce((s, p) => s + p.total, 0);
      $("ringkasHariIni").textContent = "· Hari ini: " + hariIni.length + " transaksi, " + rupiah(omzet);
      const el = $("listRiwayat");
      if (!lunas.length) { el.innerHTML = '<div class="kosong">Belum ada transaksi</div>'; return; }
      el.innerHTML = "";
      lunas.slice(0, 50).forEach((p) => {
        const waktu = new Date(p.dibayar).toLocaleString("id-ID", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
        const d = document.createElement("div");
        d.className = "kartu";
        d.innerHTML = `
      <div class="kepala"><b>${esc(namaPesanan(p))}</b><b>${rupiah(p.total)}</b></div>
      <div class="sub">${esc(ringkas(p))}</div>
      <div class="sub">${waktu}</div>`;
        el.appendChild(d);
      });
    }

    // Pindah halaman: kasir / antrian / riwayat
    function tampilView(v) {
      document.body.classList.remove("sheet-buka");
      ["Kasir", "Antrian", "Riwayat"].forEach((n) => {
        $("view" + n).hidden = n.toLowerCase() !== v;
      });
      $("bar").hidden = v !== "kasir";
      document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("aktif", b.dataset.v === v));
      if (v === "antrian") renderAntrian();
      if (v === "riwayat") renderRiwayat();
    }

    /* ========== 6d. LAYAR SELALU MENYALA (Screen Wake Lock) ==========
       Selalu aktif selama aplikasi dibuka; layar baru mati kalau
       tombol power ditekan. Butuh HTTPS.
       Sistem melepas kunci ini sendiri saat tab disembunyikan,
       jadi kita minta lagi saat halaman terlihat kembali. */
    let wakeLock = null;

    async function ambilWake() {
      try {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => { wakeLock = null; });
      } catch (e) {
        console.warn("Wake lock gagal:", e);
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && !wakeLock) ambilWake();
    });
    // Beberapa browser hanya mengizinkan setelah ada sentuhan; coba lagi saat layar disentuh
    document.addEventListener("click", () => { if (!wakeLock) ambilWake(); });

    // Batal butuh 2 ketukan (konfirmasi) supaya tidak terhapus karena salah pencet
    function batalPesanan() {
      const btn = $("btnBatal");
      if (Object.keys(keranjang).length === 0) { reset(); return; } // kosong: tidak perlu konfirmasi
      if (btn.dataset.yakin) {
        delete btn.dataset.yakin;
        btn.textContent = "Batal ✕";
        reset();
        return;
      }
      btn.dataset.yakin = "1";
      btn.textContent = "Yakin batal?";
      setTimeout(() => { delete btn.dataset.yakin; btn.textContent = "Batal ✕"; }, 3000);
    }

    /* ========== 7. PASANG EVENT & JALANKAN ========== */
    $("bayar").addEventListener("input", renderPembayaran);
    $("btnBatal").onclick = batalPesanan;
    $("btnBuka").onclick = () => document.body.classList.add("sheet-buka");
    $("btnTutup").onclick = () => document.body.classList.remove("sheet-buka");
    $("backdrop").onclick = () => document.body.classList.remove("sheet-buka");
    $("btnSelesai").onclick = selesai;

    // Harga item bebas diketik dalam RIBUAN: 6 = Rp 6.000, 2.5 = Rp 2.500
    function hargaBebas() {
      const n = parseFloat($("bebasHarga").value.replace(",", "."));
      return n > 0 ? Math.round(n * 1000) : 0;
    }
    $("bebasHarga").addEventListener("input", () => {
      const h = hargaBebas();
      $("btnBebas").textContent = h ? "+ " + rupiah(h) : "+ Tambah"; // pratinjau harga
    });
    $("bebasHarga").addEventListener("keydown", (e) => {
      if (e.key === "Enter") $("btnBebas").click();
    });
    $("btnBebas").onclick = () => {
      const harga = hargaBebas();
      if (!harga || harga <= 0) return;
      const nama = $("bebasNama").value.trim() || "Item bebas";
      const id = idBebas++;
      itemBebas[id] = { id, nama, harga };
      keranjang[id] = 1;
      $("bebasNama").value = "";
      $("bebasHarga").value = "";
      $("btnBebas").textContent = "+ Tambah";
      render();
    };

    document.querySelectorAll("#nav button").forEach((b) => (b.onclick = () => tampilView(b.dataset.v)));
    $("btnSimpan").onclick = simpanAntrian;
    setInterval(renderAntrian, 60000); // perbarui "x menit lalu"

    // Layar langsung dijaga menyala begitu aplikasi dibuka
    if ("wakeLock" in navigator) ambilWake();

    renderMenu();
    render();
    bukaDB().then(muatData).catch((e) => {
      console.error(e);
      tampilToast("Penyimpanan tidak tersedia di browser ini");
    });
  </script>
</body>

</html>
